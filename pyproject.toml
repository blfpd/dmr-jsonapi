[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-fancy-pypi-readme", "hatchling" ]


[project]
name = "dmr-jsonapi"
version = "0.1.0"
description = "JSON:API support for django-modern-rest"
keywords = [
  "API",
  "django",
  "django-api",
  "django-modern-rest",
  "dmr",
  "json:api",
  "jsonapi",
  "REST",
  "wemake-python-package",
]
license = "MIT"
license-files = [ "LICENSE" ]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: AsyncIO",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dynamic = [ "readme" ]
dependencies = [
  "django-modern-rest>=0.15,<0.18",
  "typing-extensions>=4.12",
]

[[project.authors]]
name = "Baptiste Darthenay"
email = "baptiste@ikso.net"

[project.urls]
Documentation = "https://github.com/blfpd/dmr-jsonapi#readme"
Changelog = "https://github.com/blfpd/dmr-jsonapi/blob/main/CHANGELOG.md"
GitHub = "https://github.com/blfpd/dmr-jsonapi"


[dependency-groups]
dev = [
  "django-stubs[compatible-mypy]>=6.1,<7",
  "mypy>=1.20,<3",
  "pyright>=1.1,<2",
  "ruff>=0.17,<0.18",
  "wemake-python-styleguide>=1.9,<2",
  { include-group = "unit-test" },
]
unit-test = [
  "covdefaults>=2.3,<3",
  "dirty-equals>=0.11,<0.12",
  "django>=5.2,<6.2",
  "django-modern-rest[msgspec,openapi,pydantic]",
  "inline-snapshot>=0.35,<1",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=7,<8",
  "pytest-django>=4.12,<4.15",
  "pytest-randomly>=5,<6",
  "pytest-timeout>=2.4,<3",
  "pytest-xdist>=3.8,<4",
  "strict-no-cover>=0.1,<1",
]


[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [ { path = "README.md" } ]

[tool.hatch.build.targets.sdist]
include = [
  "dmr_jsonapi/",
  "LICENSE",
]

[tool.hatch.build.targets.wheel]
only-include = [ "dmr_jsonapi" ]


[tool.uv]
# Docs: https://docs.astral.sh/uv/reference/settings
add-bounds = "major"


[tool.ruff]
# Ruff config: https://docs.astral.sh/ruff/settings
target-version = "py311"
line-length = 80
preview = true
fix = true
output-prefer-rule-codes = true

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
# Do not require docstrings in test project:
"django_test_app/**/*.py" = [ "D10" ]
# Allow asserts and private name imports and access for tests:
"tests/*.py" = [ "D10", "E501", "PLC2701", "RUF012", "S101", "SLF001" ]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.TypedDict".msg = "Use typing_extensions.TypedDict instead."

[tool.ruff.lint]
select = [
  "A",     # flake8-builtins
  "ASYNC", # flake8-async
  "B",     # flake8-bugbear
  "C4",    # flake8-comprehensions
  "C90",   # mccabe
  "COM",   # flake8-commas
  "D",     # pydocstyle
  "DJ",    # flake8-django
  "DTZ",   # flake8-datetimez
  "E",     # pycodestyle
  "ERA",   # flake8-eradicate
  "EXE",   # flake8-executable
  "F",     # pyflakes
  "FBT",   # flake8-boolean-trap
  "FLY",   # pyflint
  "FURB",  # refurb
  "G",     # flake8-logging-format
  "I",     # isort
  "ICN",   # flake8-import-conventions
  "INT",   # flake8-gettext
  "ISC",   # flake8-implicit-str-concat
  "LOG",   # flake8-logging
  "N",     # pep8-naming
  "PERF",  # perflint
  "PIE",   # flake8-pie
  "PL",    # pylint
  "PT",    # flake8-pytest-style
  "PTH",   # flake8-use-pathlib
  "Q",     # flake8-quotes
  "RET",   # flake8-return
  "RSE",   # flake8-raise
  "RUF",   # ruff
  "S",     # flake8-bandit
  "SIM",   # flake8-simplify
  "SLF",   # flake8-self
  "SLOT",  # flake8-slots
  "T100",  # flake8-debugger
  "TID",   # flake8-tidy-imports
  "TRY",   # tryceratops
  "UP",    # pyupgrade
  "W",     # pycodestyle
  "YTT",   # flake8-2020
]
ignore = [
  "A005",     # allow to shadow stdlib and builtin module names
  "ASYNC119", # `contextlib.aclosing` is not detected
  # Different doc rules that we don't really care about:
  "D100",
  "D104",
  "D106",
  "D203",
  "D212",
  "D401",
  "D404",
  "D405",
  "D418",     # We should be able to add docstrings to `@overload` decorators
  "D421",
  "ISC001",   # implicit string concat conflicts with `ruff format`
  "ISC003",   # prefer explicit string concat over implicit concat
  "PLC0414",  # do not raise on `as` re-exports
  "PLR09",    # we have our own complexity rules
  "PLR2004",  # do not report magic numbers
  "PLR6301",  # do not require classmethod / staticmethod when self not used
  "PLW2901",  # allow to redefine iteration targets in for loops
  "RUF029",   # we decide `async` functions based on API, not `await` usage
  "RUF067",   # wps handles `__init__.py` logic better
  "RUF105",   # keep old `# noqa` comments style, not `# ruff` comments
  "RUF106",   # we prefer old error codes
  "RUF201",   # keep old rule codes instead of verbose names
  "TRY003",   # long exception messages from `tryceratops`
]
external = [ "WPS" ]
# Plugin configs:
flake8-gettext.extend-function-names = [ "_" ]
flake8-quotes.inline-quotes = "single"
# For `django_test_app` only:
isort.known-first-party = [ "server" ]
mccabe.max-complexity = 6
pydocstyle.convention = "google"


[tool.codespell]
# codespell configuration: https://github.com/codespell-project/codespell
skip = [
  "*.lock",
  ".mypy_cache",
  "__pycache__",
  "htmlcov",
]


[tool.pyproject-fmt]
# Docs: https://pyproject-fmt.readthedocs.io/en/latest/configuration.html
column_width = 80
generate_python_version_classifiers = false
table_format = "long"
sub_table_spacing = "\n"
separate_root_table = "\n\n"


[tool.typos.files]
extend-exclude = [
  "__pycache__",
  ".mypy_cache",
  "htmlcov",
  "*.lock",
]


[tool.mypy]
# The mypy configurations: http://bit.ly/2zEl9WI
mypy_path = "django_test_app"
exclude = [
  # It has its own type-checking setup, since uses django:
  "django_test_app/",
]
warn_unreachable = true
enable_error_code = [
  "deprecated",
  "exhaustive-match",
  "explicit-override",
  "ignore-without-code",
  "possibly-undefined",
  "redundant-expr",
  "redundant-self",
  "truthy-bool",
  "truthy-iterable",
  "unimported-reveal",
  "unused-awaitable",
]
extra_checks = true
strict_equality_for_none = true
strict = true
plugins = [
  "pydantic.mypy",
]

[[tool.mypy.overrides]]
# Our test project imports it without type information:
module = [ "dmr_pytest" ]
ignore_missing_imports = true


[tool.pyright]
# Docs: https://microsoft.github.io/pyright/#/configuration
venv = ".venv"
venvPath = "."
strict = [ "dmr_jsonapi/**/*" ]
include = [ "dmr_jsonapi", "tests" ]
# Test project is imported by its own name in tests:
extraPaths = [ "django_test_app" ]


[tool.pytest.ini_options]
# pytest config: http://doc.pytest.org/en/latest/customize.html
# PYTHONPATH configuration:
pythonpath = [ "django_test_app" ]
# Extra options:
addopts = [
  "--strict-config",
  "--strict-markers",
  "--doctest-modules",
  "--doctest-glob=*.rst",
  "--doctest-glob=README.md",
  # Output:
  "--tb=short",
  # Coverage:
  "--cov=dmr_jsonapi",
  "--cov=django_test_app",
  "--cov=tests",
  "--cov-report=term-missing:skip-covered",
  "--cov-report=html",
  "--cov-report=xml",
  "--cov-branch",
  "--cov-fail-under=100",
]
# Strict `@xfail` by default:
xfail_strict = true
# Fail on warnings:
filterwarnings = [ "error" ]
asyncio_default_fixture_loop_scope = "function"
# pytest-asyncio configuration:
# https://pytest-asyncio.readthedocs.io/en/stable/reference/configuration.html
asyncio_mode = "auto"
# Django options:
# https://pytest-django.readthedocs.io/en/latest/
DJANGO_SETTINGS_MODULE = "server.settings"
# pytest-timeout configuration:
# https://github.com/pytest-dev/pytest-timeout
timeout = 20
timeout_method = "thread"


[tool.coverage.run]
# Covdefaults: https://pypi.org/project/covdefaults
plugins = [ "covdefaults" ]
