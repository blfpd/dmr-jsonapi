name: test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  # Used by `publish.yml`: we never publish untested code.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

    - name: Install just
      run: uv tool install rust-just

    - name: Install dependencies
      run: just install

    - name: Run linters
      run: just lint

    - name: Run type checkers
      run: just type-check

    - name: Check the package
      run: just package

    - name: Build the package
      run: just build

  dmr-versions:
    # We test against the three latest minor releases of `django-modern-rest`,
    # this job finds them, so there is no need to update the matrix by hand.
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Find latest releases
      id: versions
      run: echo "versions=$(python3 .github/scripts/dmr_versions.py)" | tee -a "$GITHUB_OUTPUT"

  test:
    name: python ${{ matrix.python-version }}, dmr ${{ matrix.dmr-version }}
    needs: dmr-versions
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      DMR_VERSION: ${{ matrix.dmr-version }}

    strategy:
      fail-fast: false
      matrix:
        # The three latest Python versions, add a new one when it is released:
        python-version: ['3.13', '3.14', '3.15']
        dmr-version: ${{ fromJson(needs.dmr-versions.outputs.versions) }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

    - name: Install just
      run: uv tool install rust-just

    - name: Install dependencies
      run: just install-test

    - name: Install django-modern-rest ${{ matrix.dmr-version }}
      run: |
        just install-dmr "$DMR_VERSION"
        uv pip list | grep -i -E '^(django|django-modern-rest|pydantic|msgspec) '

    - name: Run tests
      run: just unit
