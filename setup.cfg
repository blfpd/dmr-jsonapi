# All configuration for plugins and other utils is defined here.
# Read more about `setup.cfg`:
# https://docs.python.org/3.11/distutils/configfile.html

[flake8]
# Base flake8 configuration:
# https://flake8.pycqa.org/en/latest/user/configuration.html
format = wemake
show-source = true
statistics = false
doctests = true

# Plugins:
max-complexity = 6
max-line-length = 80
max-imports = 25
max-arguments = 6

allowed-domain-names = data

# We only run wemake-python-styleguide and system checks:
select = WPS, E99

ignore =
  # TODO: enable after the refactor
  WPS367
  # Allow logic in `__init__`
  WPS412

# Excluding some directories:
extend-exclude =
  .venv
  htmlcov

# Ignoring some errors in some files:
per-file-ignores =
  # Building JSON:API objects requires a lot of the same member names:
  dmr_jsonapi/builders.py: WPS226
  dmr_jsonapi/errors.py: WPS202, WPS226
  # Having many objects is fine, they are just type definitions:
  dmr_jsonapi/objects.py: WPS202
  # Complex test projects:
  django_test_app/server/settings.py: WPS226, WPS407
  django_test_app/server/views.py: WPS202, WPS226, WPS407, WPS432
  # Enable string overuse tests, nested classes, multiline strings,
  # and `pytest.raises` variables that are used after the block:
  tests/*.py: WPS202, WPS204, WPS210, WPS211, WPS218, WPS226, WPS430, WPS431, WPS432, WPS441, WPS462, WPS476
